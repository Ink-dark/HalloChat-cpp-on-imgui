name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -S client/cpp -B build -A x64 -DCMAKE_BUILD_TYPE=Release
        shell: pwsh
        timeout-minutes: 10

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release
        shell: pwsh


      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hallochat-client-${{ matrix.os }}
          path: build
